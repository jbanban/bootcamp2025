<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-200 min-h-screen flex items-center justify-center">
    <div class="fixed bottom-0 right-0 m-4 bg-white p-8 rounded-xl shadow-md w-3/4 max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-12">LOGIN</h1>
        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label>Username</label>
                <input type="username" id="username" name="username" class="w-full px-4 py-2 border rounded" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded" required>
            </div">
            <div class="justify-between mt-4">
                <a href="{{ url_for('register') }}" class="mx-20">Register</a>
                <button type="submit" class="mx-10 px-4 bg-black text-white py-2 rounded hover:bg-gray-800">Login</button>
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-200 to-white min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-12">Create Account</h1>
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4" enctype="multipart/form-data">
            <input type="file" id="image" name="image" accept=".png,.jpg,.jpeg,.pdf" class="w-full px-4 py-2 border rounded" required>
            <input type="text" id="name" name="name" class="w-full px-4 py-2 border rounded" placeholder="Name" required>
            <input type="date" id="bdate" name="bdate" class="w-full px-4 py-2 border rounded" required>
            <input type="text" id="address" name="address" class="w-full px-4 py-2 border rounded" placeholder="Address" required>
            <input type="text" id="username" name="username" class="w-full px-4 py-2 border rounded" placeholder="username" required>
            <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded" placeholder="Password" required>
            <div class="flex justify-between pt-4">
                <button class="w-3/12 text-white"></button>
                <button type="submit" class="w-5/12 bg-black text-white py  -2 rounded hover:bg-gray-800">register</button>
                <button class="w-3/12 text-white"></button>
            </div>
        </form>
    </div>
</body>
</html>
